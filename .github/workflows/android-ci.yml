name: Android CI and release contract

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "kemo-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing Release tag to verify, for example kemo-v1.1.7"
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test the release contract validator
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Verify source, docs and release tag
        run: python scripts/release_contract.py --expected-tag "$EXPECTED_RELEASE_TAG"

      - name: Run Android tests, lint and build
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --console=plain

      - name: Verify built APK metadata
        run: >-
          python scripts/release_contract.py
          --expected-tag "$EXPECTED_RELEASE_TAG"
          --metadata app/build/outputs/apk/debug/output-metadata.json

      - name: Upload verified CI APK
        uses: actions/upload-artifact@v7
        with:
          name: kemo-agent-app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Download published Release APK assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$EXPECTED_RELEASE_TAG" --pattern "*.apk" --dir release-assets
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo "The published Release has no APK asset." >&2
            exit 1
          }

      - name: Verify published Release APK identity and signature
        if: github.event_name == 'release' || inputs.release_tag != ''
        run: |
          set -euo pipefail
          APKANALYZER="$(find "$ANDROID_HOME" -type f -path '*/bin/apkanalyzer' -print | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKANALYZER" || { echo "apkanalyzer was not found" >&2; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner was not found" >&2; exit 1; }

          while IFS= read -r -d '' apk; do
            unzip -t "$apk" >/dev/null
            "$APKSIGNER" verify --verbose "$apk"
            version_name="$("$APKANALYZER" manifest version-name "$apk" | tr -d '\r\n')"
            version_code="$("$APKANALYZER" manifest version-code "$apk" | tr -d '\r\n')"
            application_id="$("$APKANALYZER" manifest application-id "$apk" | tr -d '\r\n')"
            python scripts/release_contract.py \
              --expected-tag "$EXPECTED_RELEASE_TAG" \
              --apk-version-name "$version_name" \
              --apk-version-code "$version_code" \
              --apk-application-id "$application_id"
          done < <(find release-assets -maxdepth 1 -type f -name '*.apk' -print0)
